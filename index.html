<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="referrer" content="no-referrer">
        <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)">
        <meta name="description" content="Berg 的观影年鉴。按年份记录看过的每一部电影与剧集。">
        <title>BERG / 观影年鉴</title>
        <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
        <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
        <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- 字体异步加载：国内访问 Google Fonts 慢时不阻塞首屏，回退到系统字体 -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
        <link rel="stylesheet" href="almanac.css?v=20260923-4">
    </head>
    <body>
        <a class="skip-link" href="#main">跳到正文</a>
        <div class="wrap">
            <header class="top">
                <a class="wordmark" href="./index.html">BERG — FILM ALMANAC</a>
                <nav class="primary-nav" aria-label="观影状态">
                    <button data-status="watched" aria-current="page">看过</button>
                    <button data-status="watching">正在看</button>
                    <button data-status="wishlist">想看</button>
                    <button data-status="discover">发现</button>
                    <button data-status="recap">看过解说</button>
                    <button data-status="dropped">弃剧</button>
                </nav>
                <label class="search-box"><span class="sr-only">搜索收藏</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索片名、笔记" autocomplete="off"></label>
            </header>

            <main id="main" tabindex="-1">
                <p id="feedback" class="feedback" role="status" aria-live="polite">正在翻开你的观影年鉴…</p>

                <div id="almanac" hidden>
                    <section class="now" id="now-section" aria-labelledby="now-title" hidden>
                        <h2 id="now-title">正在看<small class="label" id="now-count"></small></h2>
                        <div class="now-list" id="now"></div>
                    </section>

                    <div class="intro">
                        <div><p class="label">观影年鉴 · 已看过</p><h1 class="year" id="year"></h1></div>
                        <div><p class="label">每年看了多少部 · 点击切换年份</p><div class="year-bars" id="year-bars" role="group" aria-label="选择年份"></div></div>
                    </div>
                    <p class="summary" id="summary"></p>

                    <section aria-labelledby="cal-title">
                        <div class="sec-head"><h2 id="cal-title">这一年的观影日历</h2><span class="label">一格一天 · 有海报的那天看了片</span></div>
                        <div class="cal-scroll"><div class="cal" id="cal"></div></div>
                        <div class="focus" id="focus"></div>
                    </section>

                    <section aria-labelledby="genre-title">
                        <div class="sec-head"><h2 id="genre-title">类型构成</h2><span class="label">按部数占比</span></div>
                        <div class="genres" id="genres"></div>
                    </section>

                    <section aria-labelledby="best-title">
                        <div class="sec-head"><h2 id="best-title">年度最高分</h2><span class="label">按我的评分排序</span></div>
                        <div class="top-rated" id="best"></div>
                    </section>
                </div>

                <div id="list-view" hidden>
                    <div class="list-head">
                        <div><p class="label" id="list-eyebrow"></p><h1 id="list-title"></h1><p id="list-subtitle" class="list-subtitle"></p></div>
                        <div class="type-filters" role="group" aria-label="影片类型">
                            <button data-type="all" aria-pressed="true">全部</button>
                            <button data-type="movie" aria-pressed="false">电影</button>
                            <button data-type="tv" aria-pressed="false">剧集</button>
                            <button data-type="web-video" aria-pressed="false">网络视频</button>
                        </div>
                    </div>
                    <section id="grid" class="poster-grid" aria-label="影片列表"></section>
                    <section id="empty-state" class="empty-state" hidden>
                        <h2 id="empty-title">这里还没有影片</h2>
                        <p id="empty-description"></p>
                        <button id="retry" class="text-button" hidden>重新加载</button>
                    </section>
                </div>
            </main>
            <footer class="site-footer"><span id="collection-count"></span><span>数据来自 TMDB</span></footer>
        </div>

        <dialog id="movie-dialog" aria-labelledby="detail-title">
            <button id="close-dialog" class="dialog-close" aria-label="关闭影片详情">×</button>
            <div class="detail-layout"><img id="detail-poster" alt=""><div class="detail-body">
                <p id="detail-status" class="label"></p><h2 id="detail-title"></h2><p id="detail-original" class="detail-original"></p>
                <div id="detail-ratings" class="detail-ratings"></div><dl id="detail-meta"></dl>
                <section id="detail-note-section"><h3>我的观影笔记</h3><p id="detail-note"></p></section>
                <section id="detail-reason-section"><h3 id="detail-reason-heading">想看理由</h3><p id="detail-reason"></p></section>
                <section id="detail-overview-section"><h3>关于这部影片</h3>
                    <div class="spoiler" id="detail-spoiler"><p id="detail-overview" tabindex="-1"></p><button id="reveal-overview" class="spoiler-reveal">可能剧透 · 点击显示简介</button></div>
                </section>
                <a id="detail-link" class="detail-link" target="_blank" rel="noopener noreferrer">在 TMDB 查看 ↗</a>
            </div></div>
        </dialog>
        <noscript><p class="no-script">请启用 JavaScript 以浏览观影年鉴。</p></noscript>
        <script src="recommendation-engine.js?v=20260726-1"></script>
        <script type="module" src="almanac.js?v=20260923-4"></script>
    </body>
</html>
