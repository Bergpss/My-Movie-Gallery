<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>管理后台 - Berg观影记录</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
</head>

<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>🎬 观影记录管理</h1>
            <a href="index.html" class="back-link">← 返回首页</a>
        </header>

        <!-- 登录区域 -->
        <section id="login-section" class="card">
            <h2>管理员登录</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入管理员密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            <p id="login-error" class="error-message" hidden></p>
        </section>

        <!-- 管理区域（登录后显示） -->
        <section id="admin-section" class="card" hidden>
            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="search">搜索添加</button>
                <button class="tab-btn" data-tab="manual">手动添加</button>
                <button class="tab-btn" data-tab="library">我的记录</button>
            </div>

            <!-- 搜索添加 Tab -->
            <div id="search-tab" class="tab-content active">
                <form id="search-form">
                    <div class="form-row">
                        <div class="form-group flex-grow">
                            <label for="search-query">电影名称</label>
                            <input type="text" id="search-query" placeholder="输入中文或英文片名" required>
                        </div>
                        <div class="form-group">
                            <label for="search-type">类型</label>
                            <select id="search-type">
                                <option value="multi">全部</option>
                                <option value="movie">电影</option>
                                <option value="tv">剧集</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">搜索</button>
                    </div>
                </form>

                <div id="search-results" class="results-grid"></div>
                <p id="search-loading" class="loading-message" hidden>搜索中...</p>
                <p id="search-empty" class="empty-message" hidden>未找到结果</p>
            </div>

            <!-- 手动添加 Tab -->
            <div id="manual-tab" class="tab-content" hidden>
                <form id="manual-form">
                    <div class="form-group">
                        <label for="manual-id">TMDB ID</label>
                        <input type="number" id="manual-id" placeholder="例如: 269149" required>
                    </div>
                    <div class="form-group">
                        <label for="manual-title">电影名称</label>
                        <input type="text" id="manual-title" placeholder="例如: 疯狂动物城" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="manual-type">类型</label>
                            <select id="manual-type">
                                <option value="movie">电影</option>
                                <option value="tv">剧集</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="manual-status">状态</label>
                            <select id="manual-status">
                                <option value="watched">已看完</option>
                                <option value="watching">正在看</option>
                                <option value="wishlist">想看</option>
                                <option value="dropped">弃剧</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row" id="manual-watch-info-row">
                        <div class="form-group" id="manual-rating-group">
                            <label for="manual-rating">评分 (0-10)</label>
                            <input type="number" id="manual-rating" min="0" max="10" step="0.1" placeholder="可选">
                        </div>
                        <div class="form-group">
                            <label for="manual-date" id="manual-date-label">观影日期</label>
                            <input type="date" id="manual-date">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="manual-cinema"> 影院观影 🎦
                        </label>
                    </div>
                    <div class="form-group" id="manual-reason-group" hidden>
                        <label for="manual-reason">想看的理由</label>
                        <textarea id="manual-reason" rows="2" placeholder="为什么想看这部电影？"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="manual-note">备注</label>
                        <textarea id="manual-note" rows="2" placeholder="可选"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">添加电影</button>
                </form>
            </div>

            <!-- 我的记录 Tab -->
            <div id="library-tab" class="tab-content" hidden>
                <div class="library-filter">
                    <button class="filter-btn active" data-status="all">全部</button>
                    <button class="filter-btn" data-status="watching">正在看</button>
                    <button class="filter-btn" data-status="watched">已看完</button>
                    <button class="filter-btn" data-status="wishlist">想看</button>
                    <button class="filter-btn" data-status="dropped">弃剧</button>
                </div>
                <div id="library-results" class="results-grid"></div>
                <p id="library-loading" class="loading-message" hidden>加载中...</p>
                <p id="library-empty" class="empty-message" hidden>暂无记录</p>
            </div>

            <p id="admin-message" class="message" hidden></p>
        </section>

        <!-- 添加电影弹窗 -->
        <div id="add-modal" class="modal" hidden>
            <div class="modal-content">
                <button class="modal-close">&times;</button>
                <div class="modal-movie-info">
                    <img id="modal-poster" src="" alt="">
                    <div class="modal-movie-details">
                        <h3 id="modal-title"></h3>
                        <p id="modal-meta"></p>
                    </div>
                </div>
                <form id="add-form">
                    <input type="hidden" id="add-id">
                    <input type="hidden" id="add-title">
                    <input type="hidden" id="add-type">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="add-status">状态</label>
                            <select id="add-status">
                                <option value="watched">已看完</option>
                                <option value="watching">正在看</option>
                                <option value="wishlist">想看</option>
                            </select>
                        </div>
                        <div class="form-group watched-only-field" id="add-rating-group">
                            <label for="add-rating">评分 (0-10)</label>
                            <input type="number" id="add-rating" min="0" max="10" step="0.1" placeholder="可选">
                        </div>
                    </div>
                    <div class="form-row watched-only-field" id="add-watch-info-row">
                        <div class="form-group">
                            <label for="add-date" id="add-date-label">观影日期</label>
                            <input type="date" id="add-date">
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="add-cinema"> 影院观影 🎦
                            </label>
                        </div>
                    </div>
                    <div class="form-group wishlist-only-field" id="add-reason-group" hidden>
                        <label for="add-reason">想看的理由</label>
                        <textarea id="add-reason" rows="2" placeholder="为什么想看这部电影？"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="add-note">备注</label>
                        <textarea id="add-note" rows="2" placeholder="可选"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">确认添加</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 编辑电影弹窗 -->
    <div id="edit-modal" class="modal" hidden>
        <div class="modal-content">
            <button class="modal-close" id="edit-modal-close">&times;</button>
            <div class="modal-movie-info">
                <img id="edit-modal-poster" src="" alt="">
                <div class="modal-movie-details">
                    <h3 id="edit-modal-title"></h3>
                    <p id="edit-modal-meta"></p>
                </div>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-status">状态</label>
                        <select id="edit-status">
                            <option value="watched">已看完</option>
                            <option value="watching">正在看</option>
                            <option value="wishlist">想看</option>
                            <option value="dropped">弃剧</option>
                        </select>
                    </div>
                    <div class="form-group watched-only-field" id="edit-rating-group">
                        <label for="edit-rating">评分 (0-10)</label>
                        <input type="number" id="edit-rating" min="0" max="10" step="0.1" placeholder="可选">
                    </div>
                </div>
                <div class="form-row watched-only-field" id="edit-watch-info-row">
                    <div class="form-group">
                        <label for="edit-date" id="edit-date-label">观影日期</label>
                        <input type="date" id="edit-date">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="edit-cinema"> 影院观影 🎦
                        </label>
                    </div>
                </div>
                <div class="form-group wishlist-only-field" id="edit-reason-group" hidden>
                    <label for="edit-reason">想看的理由</label>
                    <textarea id="edit-reason" rows="2" placeholder="为什么想看这部电影？"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-note">备注</label>
                    <textarea id="edit-note" rows="2" placeholder="可选"></textarea>
                </div>
                <div class="edit-buttons">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <button type="button" class="btn btn-danger" id="delete-movie-btn">删除电影</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
